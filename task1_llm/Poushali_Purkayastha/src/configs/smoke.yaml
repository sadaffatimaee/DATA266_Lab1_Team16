run_name: smoke
is_final: false
seed: 20
data:
  source: hf
  hf_dataset: roneneldan/TinyStories
  block_size: 64
  n_train: 2000
  n_val: 200
  val_story_fraction: 0.1
  char_margin: 1.05
model:
  n_layer: 2
  d_model: 64
  n_head: 2
  d_ff: 256
  dropout: 0.1
train:
  epochs: 1
  batch_size: 32
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 10
  schedule: cosine
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  amp: true
  log_interval: 10
  eval_batch_size: 64
generation:
  prompts: ["Once upon a time"]
  max_new_tokens: 60
  temperatures: [1.0]
  n_per_prompt: 1
